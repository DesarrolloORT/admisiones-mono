name: Auto - Release (Semantic Versioning)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Obtener último tag
      # -----------------------------
      - name: Get latest tag
        id: latest
        run: |
          TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      # -----------------------------
      # Obtener info del PR mergeado
      # -----------------------------
      - name: Extract PR signals
        id: signals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener el PR mergeado asociado al commit actual usando la API de GitHub
          # Esta API devuelve los PRs que contienen el commit especificado
          PR_DATA=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0] | {title: .title, body: .body}' 2>/dev/null || echo "")
          
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" = "null" ]; then
            echo "No merged PR found for this commit, defaulting to patch"
            echo "major=false" >> $GITHUB_OUTPUT
            echo "minor=false" >> $GITHUB_OUTPUT
            echo "patch=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')
          BODY=$(echo "$PR_DATA" | jq -r '.body // ""')
          TEXT="$TITLE $BODY"
          
          echo "PR Title: $TITLE"
          echo "Searching for version signals in: $TEXT"
          
          # Buscar versión explícita
          if [[ "$TEXT" =~ (v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "explicit=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          fi

          # Detectar señales de versión (case insensitive y con/sin espacio después del #)
          if echo "$TEXT" | grep -qiE '#\s*major'; then
            echo "major=true" >> $GITHUB_OUTPUT
            echo "Detected: MAJOR bump"
          else
            echo "major=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$TEXT" | grep -qiE '#\s*minor'; then
            echo "minor=true" >> $GITHUB_OUTPUT
            echo "Detected: MINOR bump"
          else
            echo "minor=false" >> $GITHUB_OUTPUT
          fi
          
          if echo "$TEXT" | grep -qiE '#\s*patch'; then
            echo "patch=true" >> $GITHUB_OUTPUT
            echo "Detected: PATCH bump"
          else
            echo "patch=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------
      # Calcular versión
      # -----------------------------
      - name: Calculate version
        id: version
        run: |
          LATEST="${{ steps.latest.outputs.latest_tag }}"
          EXPLICIT="${{ steps.signals.outputs.explicit }}"
          MAJOR_FLAG="${{ steps.signals.outputs.major }}"
          MINOR_FLAG="${{ steps.signals.outputs.minor }}"

          if [ -z "$LATEST" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            VERSION=${LATEST#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          fi

          if [ -n "$EXPLICIT" ]; then
            NEW="$EXPLICIT"
          elif [ "$MAJOR_FLAG" = "true" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            NEW="v$MAJOR.$MINOR.$PATCH"
          elif [ "$MINOR_FLAG" = "true" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
            NEW="v$MAJOR.$MINOR.$PATCH"
          else
            PATCH=$((PATCH + 1))
            NEW="v$MAJOR.$MINOR.$PATCH"
          fi

          if git rev-parse "$NEW" >/dev/null 2>&1; then
            echo "❌ Tag $NEW already exists"
            exit 1
          fi

          echo "new_tag=$NEW" >> $GITHUB_OUTPUT

      - name: Create tag & release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Release ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
