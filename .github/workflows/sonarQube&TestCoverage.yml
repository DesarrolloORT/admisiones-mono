name: SonarQube + Unit Tests and Coverage

on:
  push:
    branches:
      - develop

jobs:
  sonar-and-tests:
    name: SonarQube and Unit Tests with Coverage
    runs-on: sonar-runner
    environment: develop
    permissions: read-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0

      - name: Ensure .NET 9 is used
        shell: cmd
        run: |
          set DOTNET_ROOT=C:\Program Files\dotnet
          set PATH=C:\Program Files\dotnet;%PATH%
          dotnet --info
          dotnet --list-sdks
      - name: Begin SonarQube Scan
        shell: cmd
        run: |
          SonarScanner.MSBuild.exe begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" ^
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" ^
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" ^
            /d:sonar.scm.disabled=true ^
            /d:sonar.verbose=true ^
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Properties/**,**/FichaDePersona/AppLogic/DevartDTOs/**,**/FichaDePersona/BusinessLogic/DevartEFCore/**,**/FichaDePersona/DataAccess/DevartDataAccess/**,**/FichaDePersona/UnitTesting/**,**/FichaDePersona/UnitTesting/Security/**,**/Core/Modules/ModBandeja/ModAppLogic/DevartDTOs/**,**/Core/Modules/ModBandeja/ModBusinessLogic/DevartEFCore/**,**/Core/Modules/ModBandeja/ModDataAccess/DevartDataAccess/**,**/Core/MailORT/Connected Services/**,**/Core/Modules/ModGenericBase/ModAppLogic/DevartDTOs/**,**/Core/Modules/ModGenericBase/ModBusinessLogic/DevartEFCore/**,**/Core/Modules/ModGenericBase/ModDataAccess/DevartDataAccess/**" ^
            /d:"sonar.inclusions=**/*.cs" ^
            /d:sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml ^
            /d:sonar.coverage.exclusions=**/Program.cs ^
            /d:sonar.sourceEncoding=UTF-8
      - name: Restore dependencies
        run: dotnet restore FichaDePersona/WebApiFDP.sln

      - name: Build Project
        run: dotnet build FichaDePersona/WebApiFDP.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        shell: cmd
        run: |
          dotnet test FichaDePersona/UnitTesting/UnitTesting.csproj ^
            --settings FichaDePersona/UnitTesting/tests.runsettings ^
            --results-directory ./TestResults ^
            --logger "trx;LogFileName=test_results.trx" ^
            /p:CollectCoverage=true ^
            /p:CoverletOutputFormat=cobertura ^
            /p:CoverletOutput=./TestResults/ || exit 0
      - name: Check generated coverage file
        shell: cmd
        run: dir /s TestResults

      - name: Install ReportGenerator locally
        run: dotnet tool install --tool-path .reportgenerator dotnet-reportgenerator-globaltool
  
      - name: Convert cobertura to SonarQube format
        shell: cmd
        run: |
          .reportgenerator\reportgenerator ^
             -reports:TestResults/**/coverage.cobertura.xml ^
             -targetdir:coveragereport ^
             -reporttypes:SonarQube ^
             -sourceLink:true ^
             -assemblyfilters:+* ^
             -classfilters:+* ^
             -filefilters:+*
             
      - name: Confirm SonarQube coverage file exists
        shell: cmd
        run: |
          if exist coveragereport\SonarQube.xml (
            echo SonarQube.xml FOUND
          ) else (
            echo SonarQube.xml NOT FOUND && exit 1
          )
      - name: Upload SonarQube coverage file
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: coveragereport/SonarQube.xml

      - name: End SonarQube Scan
        shell: cmd
        run: |
          SonarScanner.MSBuild.exe end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
