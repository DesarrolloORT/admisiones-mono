name: SonarQube - Main Branches

on:
  push:
    branches:
      - main
      - v*.*.*/main
      - latest/main

concurrency:
  group: 'sonar-main-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  prepare_api:
    name: Prepare API contracts
    runs-on: funcionarios-desa
    environment: desarrollo
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to GitHub Packages
        shell: powershell
        run: |
          "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" | Set-Content -Path "$HOME/.npmrc"
          "@desarrolloort:registry=https://npm.pkg.github.com" | Add-Content -Path "$HOME/.npmrc"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Generate API contracts
        run: npm run update-api

      - name: Upload API contracts
        uses: actions/upload-artifact@v7
        with:
          name: api-generated
          path: src/app/shared/api/generated
          retention-days: 1

  coverage:
    name: Generate coverage results
    needs: prepare_api
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/vitest
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Download API contracts
        uses: actions/download-artifact@v8
        with:
          name: api-generated
          path: src/app/shared/api/generated

      - name: Generate coverage
        run: npm run test:sonar

      - name: Upload coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  sonar-scan:
    name: SonarQube Scan
    runs-on: sonar-runner
    needs: coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage files
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\sonar-scanner\run.ps1 ^
            -D "sonar.host.url=${{ secrets.SONAR_HOST_URL }}" ^
            -D "sonar.token=${{ secrets.SONAR_TOKEN }}" ^
            -D "sonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}" ^
            -D "sonar.branch.name=${{ github.ref_name }}" ^
            -D "sonar.qualitygate.wait=true" ^
            -D "sonar.qualitygate.timeout=300"
