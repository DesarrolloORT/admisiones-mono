name: E2E Nightly

on:
  schedule:
    # Monday 04:00 America/Montevideo. GitHub schedules are UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e-nightly:
    name: Preprod controlled E2E
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate nightly configuration
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_NIGHTLY_DOCUMENT_NUMBER: ${{ secrets.E2E_NIGHTLY_DOCUMENT_NUMBER }}
          E2E_NIGHTLY_PASSWORD: ${{ secrets.E2E_NIGHTLY_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_NIGHTLY_DOCUMENT_NUMBER"
          test -n "$E2E_NIGHTLY_PASSWORD"

      - name: Run nightly E2E
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_NIGHTLY_DOCUMENT_NUMBER: ${{ secrets.E2E_NIGHTLY_DOCUMENT_NUMBER }}
          E2E_NIGHTLY_PASSWORD: ${{ secrets.E2E_NIGHTLY_PASSWORD }}
        run: npx playwright test --config playwright.config.ts --grep @nightly --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-nightly-report
          path: playwright-report
          if-no-files-found: ignore
