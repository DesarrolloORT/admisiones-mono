name: CI - develop branches

# CI permisivo por diseno: solo unit tests + build. El gate completo
# (lint + a11y + e2e + Sonar) sigue estando en el PR de develop -> v*.*.*/main.
on:
  pull_request:
    branches:
      - v*.*.*/develop

permissions:
  contents: read
  packages: read

concurrency:
  # Cancel any running workflow for the same branch when new commits are pushed.
  # We group both by ref_name (available when CI is triggered by a push to a branch/tag)
  # and head_ref (available when CI is triggered by a PR).
  group: '${{ github.ref_name }}-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  prepare_api:
    # No es opcional: src/app/shared/api/generated/** esta gitignored y
    # ci-checks.yml lo consume como artifact para compilar y correr los tests.
    name: Prepare API contracts
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/prepare-api-contracts.yml
    with:
      environment: desarrollo
      runs-on: blacksmith-8vcpu-ubuntu-2404
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name }}
      checkout-ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  ci:
    name: CI Checks
    needs: prepare_api
    uses: ./.github/workflows/ci-checks.yml
    with:
      environment: desarrollo
      build-configuration: development
      strict: false
      checkout-repository: ${{ github.event.pull_request.head.repo.full_name }}
      checkout-ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit
