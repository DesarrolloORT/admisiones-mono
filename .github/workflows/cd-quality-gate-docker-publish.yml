name: CD - Check Quality Gate and Docker Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
      
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOCKERFILE_PATH: Empleos/WebApiEmpleos/Dockerfile
  IMAGE_NAME: ghcr.io/desarrolloort/api-empleos

jobs:
  # ============================================================================
  # Job 1: Quality Gate Check (verifica que pase el Quality Gate de SonarQube)
  # Solo se ejecuta en main 
  # ============================================================================
  quality-gate-check:
    name: Quality Gate & Docker Publish
    runs-on: sonar-runner
    environment: production
    timeout-minutes: 15

    steps:
      - name: Poll SonarQube Quality Gate
        id: quality-gate
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          Write-Host "Checking Quality Gate status (with retries)..."
          $maxRetries = 12
          $sleepSeconds = 15
          $qualityGateStatus = "UNKNOWN"
          
          # Ignorar errores de certificados SSL (para servidores internos con certificados auto-firmados)
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          
          # Usar variables de entorno para mayor seguridad
          $sonarToken = $env:SONAR_TOKEN
          $sonarUrl = $env:SONAR_URL
          $projectKey = $env:SONAR_PROJECT_KEY
          $branchName = $env:BRANCH_NAME
          $encodedBranch = [uri]::EscapeDataString($branchName)
          
          Write-Host "SonarQube URL: $sonarUrl"
          Write-Host "Project Key: $projectKey"
          Write-Host "Branch: $branchName"
          
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $authHeader = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${sonarToken}:"))
              $headers = @{ Authorization = "Basic $authHeader" }
              $url = "${sonarUrl}/api/qualitygates/project_status?projectKey=${projectKey}&branch=${encodedBranch}"
              
              Write-Host "Calling: $url"
              
              $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get -ErrorAction Stop
              
              Write-Host "Response received: $($response | ConvertTo-Json -Depth 3)"
              
              $qualityGateStatus = $response.projectStatus.status
              
              if (-not $qualityGateStatus) {
                $qualityGateStatus = "UNKNOWN"
                Write-Host "Status field not found in response"
              }
            } catch {
              Write-Host "Error calling SonarQube API:"
              Write-Host "Exception Message: $($_.Exception.Message)"
              Write-Host "Full Error: $_"
              
              # Si es un error de analisis pendiente, esperar y reintentar
              if ($_.Exception.Message -match "pending" -or $_.Exception.Message -match "not found") {
                $qualityGateStatus = "PENDING"
              } else {
                $qualityGateStatus = "ERROR"
              }
            }
            
            Write-Host "Attempt $i/$maxRetries -> $qualityGateStatus"
            
            if ($qualityGateStatus -eq "OK") {
              break
            }
            
            if ($qualityGateStatus -eq "ERROR") {
              # En caso de ERROR, no salir inmediatamente, dar mas reintentos
              if ($i -ge 3) {
                break
              }
            }
            
            if ($qualityGateStatus -eq "NONE") {
              break
            }
            
            if ($i -lt $maxRetries) {
              Write-Host "Waiting $sleepSeconds seconds before next attempt..."
              Start-Sleep -Seconds $sleepSeconds
            }
          }
          
          "quality_gate_status=$qualityGateStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          
          if ($qualityGateStatus -ne "OK") {
            Write-Host "Quality Gate FAILED! (status=$qualityGateStatus)"
            exit 1
          }
          
          Write-Host "Quality Gate PASSED!"
      - name: Quality Gate Result Summary
        if: always()
        shell: powershell
        run: |
          $status = "${{ steps.quality-gate.outputs.quality_gate_status }}"
          "## Quality Gate Result" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($status -eq "OK") {
            "**Quality Gate: PASSED**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "The code meets all quality standards. Proceeding to build Docker image." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "**Quality Gate: FAILED**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "The code does not meet the quality standards. Docker image will NOT be built." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

  # ============================================================================
  # Job 2: Build and Publish Docker Image
  # En main: solo si Quality Gate pasa
  # En develop/testing: se ejecuta directamente sin Quality Gate
  # ============================================================================
  build-and-push:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: quality-gate-check
    if: always() && (needs.quality-gate-check.result == 'success' || needs.quality-gate-check.result == 'skipped')

    permissions:
      contents: read
      packages: write
      repository-projects: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch,suffix=-latest
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max