name: CI - SonarQube and Tests

on:
  pull_request:
    branches:
      - develop
      - testing
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: Empleos/WebApiEmpleos.sln
  TEST_PROJECT_PATH: Empleos/UnitTesting/UnitTesting.csproj

jobs:
  sonar-and-tests:
    name: CI - SonarQube & Tests (PRs & Main)
    runs-on: sonar-runner
    environment: develop
    permissions: read-all
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Add .NET to PATH
        shell: cmd
        run: echo ${{ runner.temp }}\dotnet>> %GITHUB_PATH%

      - name: Verify .NET SDK version
        shell: cmd
        run: dotnet --version

      - name: Begin SonarQube Scan
        shell: cmd
        run: |
          SonarScanner.MSBuild.exe begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" ^
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" ^
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" ^
            /d:sonar.scm.disabled=true ^
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/Properties/**,**/Empleos/AppLogic/DevartDTOs/**,**/Empleos/BusinessLogic/DevartEFCore/**,**/Empleos/DataAccess/DevartDataAccess/**,**/Core/**" ^
            /d:"sonar.inclusions=**/*.cs" ^
            /d:sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml ^
            /d:sonar.coverage.exclusions=**/Program.cs ^
            /d:sonar.sourceEncoding=UTF-8

      - name: Restore and Build
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run unit tests with coverage
        shell: cmd
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} ^
            --configuration Release ^
            --no-build ^
            --settings Empleos/UnitTesting/tests.runsettings ^
            --results-directory ./TestResults ^
            --logger "trx;LogFileName=test_results.trx" ^
            /p:CollectCoverage=true ^
            /p:CoverletOutputFormat=cobertura ^
            /p:CoverletOutput=./TestResults/

      - name: Install ReportGenerator and convert coverage
        run: |
          dotnet tool install --tool-path .reportgenerator dotnet-reportgenerator-globaltool
          .reportgenerator/reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:coveragereport -reporttypes:SonarQube

      - name: Verify and upload coverage report
        shell: cmd
        run: |
          if not exist coveragereport\SonarQube.xml (
            echo SonarQube.xml NOT FOUND && exit 1
          )
          echo SonarQube.xml FOUND

      - name: Upload SonarQube coverage file
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: coveragereport/SonarQube.xml
          retention-days: 7

      - name: End SonarQube Scan
        shell: cmd
        run: |
          SonarScanner.MSBuild.exe end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
