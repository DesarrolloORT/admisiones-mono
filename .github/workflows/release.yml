name: Build and Attach to Release

on:
  release:
    types: [published]

jobs:
  fetch_api_spec:
    # Job minimo en el runner self-hosted: solo descarga swagger.json + contratos
    # de la red interna (sin npm ci, sin Java). La generacion corre en la nube.
    name: Fetch API spec (internal network)
    runs-on: funcionarios-desa
    env:
      API_ORIGIN: ${{ vars.DESA_API_ORIGIN || 'https://apiadmisionesdesa.ort.edu.uy' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download Swagger and form contracts
        run: node scripts/codegen/fetch-api-spec.js --origin "$env:API_ORIGIN" --output .api-spec

      - name: Upload API spec snapshot
        uses: actions/upload-artifact@v7
        with:
          name: api-spec
          path: .api-spec
          retention-days: 1

  build:
    name: Build
    needs: fetch_api_spec
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: prod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa --refresh

      - name: Download API spec snapshot
        uses: actions/download-artifact@v8
        with:
          name: api-spec
          path: .api-spec

      - name: Generate API contracts
        # --skip-build: el build de produccion del paso siguiente valida la compilacion.
        run: npm run update-api -- --spec-dir .api-spec --skip-build

      - name: Build
        run: npx ng build --configuration production

      - name: Archive build
        run: |
          release_tag="${GITHUB_REF/refs\/tags\//}"
          zip_name="${{ secrets.REPO_NAME }}-${release_tag}.zip"
          cd "dist/${{ secrets.REPO_NAME }}/browser"
          zip -r "$GITHUB_WORKSPACE/$zip_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: ${{secrets.REPO_NAME}}-${{ github.event.release.tag_name }}.zip

  attach-release:
    name: Attach Build Asset to Release
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact

      - name: Attach build to release
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{secrets.REPO_NAME}}-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip

  notify_release_execution:
    name: Notify release execution status
    if: always()
    needs: attach-release
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.attach-release.result }}
      workflow-name: ${{ github.workflow }}
