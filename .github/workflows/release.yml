name: Build and Attach to Release

on:
  release:
    types: [published]

jobs:
  fetch_api_spec:
    name: Fetch API spec (internal network)
    uses: ./.github/workflows/fetch-api-spec.yml
    secrets: inherit

  prepare_api:
    name: Prepare API contracts
    needs: fetch_api_spec
    uses: ./.github/workflows/prepare-api-contracts.yml
    with:
      environment: prod
      runs-on: blacksmith-8vcpu-ubuntu-2404
      env-sync-refresh: true
    secrets: inherit

  build:
    name: Build
    needs: prepare_api
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: prod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa --refresh

      - name: Download API contracts
        uses: actions/download-artifact@v8
        with:
          name: api-generated
          path: src/app/shared/api/generated

      - name: Build
        run: npx ng build --configuration production

      - name: Archive build
        run: |
          release_tag="${GITHUB_REF/refs\/tags\//}"
          zip_name="${{ secrets.REPO_NAME }}-${release_tag}.zip"
          cd "dist/${{ secrets.REPO_NAME }}/browser"
          zip -r "$GITHUB_WORKSPACE/$zip_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: ${{secrets.REPO_NAME}}-${{ github.event.release.tag_name }}.zip

  attach-release:
    name: Attach Build Asset to Release
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact

      - name: Attach build to release
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{secrets.REPO_NAME}}-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip

  notify_release_execution:
    name: Notify release execution status
    if: always()
    needs: attach-release
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.attach-release.result }}
      workflow-name: ${{ github.workflow }}
