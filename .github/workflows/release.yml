name: Build and Attach to Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Setup environment variables
        uses: ./.github/actions/setup-env
        with:
          env-filename: prod
          CSP_POLICY: ${{ vars.CSP_POLICY }}
          RECAPTCHA_NONCE: ${{ vars.RECAPTCHA_NONCE }}
          CACHING_ENABLED: ${{ vars.CACHING_ENABLED || 'true' }}
        env:
          RECAPTCHA_KEY: ${{ secrets.RECAPTCHA_KEY }}
          API_URL: ${{ secrets.API_URL }}

      - name: Build
        run: npm run build

      - name: Archive build
        run: |
          release_tag="${GITHUB_REF/refs\/tags\//}"
          zip_name="${{ secrets.REPO_NAME }}-${release_tag}.zip"
          cd "dist/${{ secrets.REPO_NAME }}/browser"
          zip -r "$GITHUB_WORKSPACE/$zip_name" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: ${{secrets.REPO_NAME}}-${{ github.event.release.tag_name }}.zip

  attach-release:
    name: Attach Build Asset to Release
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact

      - name: Attach build to release
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{secrets.REPO_NAME}}-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip

  notify_release_execution:
    name: Notify release execution status
    if: always()
    needs: attach-release
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.attach-release.result }}
      workflow-name: ${{ github.workflow }}
