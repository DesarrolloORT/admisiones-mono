name: PR state label manager

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types:
      - opened # When a PR is created
      - review_requested
      - ready_for_review
      - closed # When a PR is closed
  issues:
    types:
      - labeled # (For manual changes or if your linking/unlinking emits label events)
      # Note: GitHub does not have a direct “linked/unlinked” event.
      # You may need to use a bot or custom webhook to detect issue linking changes.

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log PR information
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "PR number: ${{ github.event.pull_request.number }}"

      # When a PR is created, add "state: pending review" label
      - name: Add Pending Review on PR Opened
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
        run: |
          echo "Adding 'state: pending review' label"
          gh pr edit "${{ github.event.pull_request.number }}" --add-label "state: pending review"

      # When a review is submitted, update the PR label to "state: pending approval"
      - name: Update Label on PR Review
        if: ${{ github.event_name == 'pull_request_review' && github.event.action == 'submitted' }}
        run: |
          echo "Updating label to 'state: pending approval'"
          # Remove "pending review" (if present) and add "state: pending approval"
          gh pr edit "${{ github.event.pull_request.number }}" --remove-label "state: pending review" --add-label "state: pending approval"

      # When a PR is closed and if it was approved, remove other state labels and add "approved"
      - name: Finalize PR on Closed & Approved
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
        run: |
          echo "Finalizing PR labels"
          # (Assuming your logic determines the PR was approved)
          # Remove state labels (both pending review & pending approval) and add "state: approved"
          gh pr edit "${{ github.event.pull_request.number }}" --remove-label "state: pending review,state: pending approval" --add-label "state: approved"

