name: Create Tag on PR Update

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  create_tag:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'v') || startsWith(github.event.pull_request.title, 'release/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all tags

      - name: Set up Git configuration and authentication
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Reconfigure the remote with the GITHUB_TOKEN to allow tag pushes
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Create tag if branch or PR title follows version pattern
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "PR head branch: $HEAD_REF"
          echo "PR title: $PR_TITLE"

          # Check if branch matches pattern: v*.*.*/main
          if [[ "$HEAD_REF" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)/main$ ]]; then
            echo "Branch matches pattern v*.*.*/main"
            VERSION=${BASH_REMATCH[1]}
          # Else, check if PR title matches pattern: release/v*.*.*
          elif [[ "$PR_TITLE" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "PR title matches pattern release/v*.*.*"
            VERSION=${BASH_REMATCH[1]}
          else
            echo "Neither branch nor PR title contains valid version information. Skipping tagging."
            exit 1
          fi

          echo "Extracted version: $VERSION"

          # Ensure the version has three parts (major.minor.patch). If not, append .0.
          if [[ $(echo "$VERSION" | grep -o "\." | wc -l) -lt 2 ]]; then
            VERSION="${VERSION}.0"
            echo "Normalized version to three parts: $VERSION"
          fi

          # Define the tag prefix. Tags must be in the format preprod/*.*.*.* where the first three segments match the version.
          TAG_PREFIX="preprod/${VERSION}."
          echo "Looking for existing tags with prefix: $TAG_PREFIX"

          # Find the latest tag matching the prefix. If none is found, start at 0.
          LAST_TAG=$(git tag --list "${TAG_PREFIX}*" | sort -V | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            NEXT_SEQ=0
          else
            echo "Last tag found: $LAST_TAG"
            # Extract the sequential part (the fourth segment) of the tag.
            LAST_SEQ=$(echo "$LAST_TAG" | awk -F. '{print $4}')
            NEXT_SEQ=$((LAST_SEQ + 1))
          fi

          NEW_TAG="preprod/${VERSION}.${NEXT_SEQ}"
          echo "Creating new tag: $NEW_TAG"

          # Create and push the new tag.
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

