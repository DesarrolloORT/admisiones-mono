name: Deploy to Development Environment

on:
  push:
    branches:
      - v*.*.*/main
  workflow_dispatch:

jobs:
  fetch_api_spec:
    name: Fetch API spec (internal network)
    uses: ./.github/workflows/fetch-api-spec.yml
    secrets: inherit

  prepare_api:
    name: Prepare API contracts
    needs: fetch_api_spec
    uses: ./.github/workflows/prepare-api-contracts.yml
    with:
      environment: desarrollo
      runs-on: ubuntu-latest
    secrets: inherit

  build:
    name: Build
    needs: prepare_api
    runs-on: ubuntu-latest
    environment: desarrollo
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Download API contracts
        uses: actions/download-artifact@v8
        with:
          name: api-generated
          path: src/app/shared/api/generated

      - name: Build
        run: npx ng build --configuration development

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist/admisiones/browser

  deploy:
    name: Deploy
    runs-on: funcionarios-desa
    environment: desarrollo
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact

      - name: Delete existing files from site directory
        run: |
          $sitePath = '${{ vars.DEV_SERVER_SITE_PATH }}'
          if ([string]::IsNullOrWhiteSpace($sitePath)) {
            throw "vars.DEV_SERVER_SITE_PATH no esta configurada para el environment 'desarrollo'; se aborta para evitar borrar la raiz del disco."
          }
          if (-not (Test-Path -LiteralPath $sitePath)) {
            throw "El path '$sitePath' no existe en este runner; se aborta el borrado."
          }
          Remove-Item -Recurse -Force (Join-Path $sitePath '*')

      - name: Copy Build files into site directory
        run: Copy-Item -Path .\* -Destination '${{vars.DEV_SERVER_SITE_PATH}}' -Recurse

  notify_deploy_execution:
    name: Notify deploy execution status
    if: always()
    needs: deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.deploy.result }}
      workflow-name: ${{ github.workflow }}
