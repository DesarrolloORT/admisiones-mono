name: Deploy to Preproduction Environment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch_api_spec:
    name: Fetch API spec (internal network)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/fetch-api-spec.yml
    secrets: inherit

  prepare_api:
    name: Prepare API contracts
    needs: fetch_api_spec
    uses: ./.github/workflows/prepare-api-contracts.yml
    with:
      environment: preprod
      runs-on: ubuntu-latest
    secrets: inherit

  build:
    name: Build
    needs: prepare_api
    runs-on: ubuntu-latest
    environment: preprod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Download API contracts
        uses: actions/download-artifact@v8
        with:
          name: api-generated
          path: src/app/shared/api/generated

      - name: Build
        run: npx ng build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist/admisiones/browser

  notify_build_execution:
    name: Notify build execution status
    if: always()
    needs: build
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.build.result }}
      workflow-name: ${{ github.workflow }}
