name: Deploy to Preproduction Environment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare_api:
    name: Prepare API contracts
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: funcionarios-desa
    environment: preprod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to GitHub Packages
        shell: powershell
        run: |
          "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" | Set-Content -Path "$HOME/.npmrc"
          "@desarrolloort:registry=https://npm.pkg.github.com" | Add-Content -Path "$HOME/.npmrc"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Generate API contracts
        run: npm run update-api

      - name: Upload API contracts
        uses: actions/upload-artifact@v7
        with:
          name: api-generated
          path: src/app/shared/api/generated
          retention-days: 1

  build:
    name: Build
    needs: prepare_api
    runs-on: ubuntu-latest
    environment: preprod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Download API contracts
        uses: actions/download-artifact@v8
        with:
          name: api-generated
          path: src/app/shared/api/generated

      - name: Build
        run: npx ng build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist/admisiones/browser

  deploy:
    name: Deploy
    runs-on: funcionarios-desa
    environment: preprod
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact

      - name: Delete existing files from site directory
        run: Remove-Item -Recurse -Force '${{vars.DEV_SERVER_SITE_PATH}}\*'

      - name: Copy Build files into site directory
        run: Copy-Item -Path .\* -Destination '${{vars.DEV_SERVER_SITE_PATH}}' -Recurse

  notify_deploy_execution:
    name: Notify deploy execution status
    if: always()
    needs: deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.deploy.result }}
      workflow-name: ${{ github.workflow }}
