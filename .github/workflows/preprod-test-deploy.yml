name: Deploy to Preproduction Environment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch_api_spec:
    # Job minimo en el runner self-hosted: solo descarga swagger.json + contratos
    # de la red interna (sin npm ci, sin Java). La generacion corre en la nube.
    name: Fetch API spec (internal network)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: funcionarios-desa
    env:
      API_ORIGIN: ${{ vars.DESA_API_ORIGIN || 'https://apiadmisionesdesa.ort.edu.uy' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download Swagger and form contracts
        run: node scripts/codegen/fetch-api-spec.js --origin "$env:API_ORIGIN" --output .api-spec

      - name: Upload API spec snapshot
        uses: actions/upload-artifact@v7
        with:
          name: api-spec
          path: .api-spec
          retention-days: 1

  prepare_api:
    name: Prepare API contracts
    needs: fetch_api_spec
    runs-on: ubuntu-latest
    environment: preprod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Download API spec snapshot
        uses: actions/download-artifact@v8
        with:
          name: api-spec
          path: .api-spec

      - name: Generate API contracts
        # --skip-build: el job build ya compila el proyecto con estos contratos.
        run: npm run update-api -- --spec-dir .api-spec --skip-build

      - name: Upload API contracts
        uses: actions/upload-artifact@v7
        with:
          name: api-generated
          path: src/app/shared/api/generated
          retention-days: 1

  build:
    name: Build
    needs: prepare_api
    runs-on: ubuntu-latest
    environment: preprod
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Authenticate to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@desarrolloort:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Sync environment from Azure App Configuration
        run: npm run env:sync -- --env desa

      - name: Download API contracts
        uses: actions/download-artifact@v8
        with:
          name: api-generated
          path: src/app/shared/api/generated

      - name: Build
        run: npx ng build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist/admisiones/browser

  deploy:
    name: Deploy
    runs-on: funcionarios-desa
    environment: preprod
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact

      - name: Delete existing files from site directory
        run: Remove-Item -Recurse -Force '${{vars.DEV_SERVER_SITE_PATH}}\*'

      - name: Copy Build files into site directory
        run: Copy-Item -Path .\* -Destination '${{vars.DEV_SERVER_SITE_PATH}}' -Recurse

  notify_deploy_execution:
    name: Notify deploy execution status
    if: always()
    needs: deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      result: ${{ needs.deploy.result }}
      workflow-name: ${{ github.workflow }}
