# Configuración de etiquetado automático para Pull Requests
# Este archivo es leído por actions/labeler en el workflow pr-open.yml
# Referencia: https://github.com/actions/labeler
#
# NOTA: El submódulo Core tiene su propio workflow de labeler.
#       Aquí solo se etiquetan cambios en ApiAdmisiones.

# ═══════════════════════════════════════════════════════════════════
# ETIQUETAS POR CAPA DE ARQUITECTURA (ApiAdmisiones)
# ═══════════════════════════════════════════════════════════════════

# Capa de API (Controllers, Middlewares, Security)
layer:api:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*'

# Capa de Aplicación (Servicios, DTOs)
layer:app-logic:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/AppLogic.*/**/*'

# Capa de Negocio (Entidades, Interfaces de repositorio)
layer:business-logic:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/BusinessLogic/**/*'

# Capa de Acceso a Datos (Repositorios, DbContext)
layer:data-access:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/DataAccess/**/*'

# ═══════════════════════════════════════════════════════════════════
# ETIQUETAS POR TIPO DE ARCHIVO
# ═══════════════════════════════════════════════════════════════════
# NOTA: Estas etiquetas aplican solo al código fuente, NO a tests.
#       Los patrones están diseñados para excluir la carpeta UnitTesting.

# Código auto-generado por Devart (NO modificar manualmente)
auto-generated:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/AppLogic.DevartDtos/**/*'
          - 'WebApiAdmisiones/BusinessLogic/DevartEFCore/**/*'
          - 'WebApiAdmisiones/DataAccess/DevartDataAccess/**/*'
          - 'WebApiAdmisiones/AppLogic.*/**/*.Generated.cs'
          - 'WebApiAdmisiones/BusinessLogic/**/*.Generated.cs'
          - 'WebApiAdmisiones/DataAccess/**/*.Generated.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*.Generated.cs'

# DTOs (Data Transfer Objects) - solo código fuente, no tests
type:dto:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/AppLogic.*/DTOs/**/*'
          - 'WebApiAdmisiones/AppLogic.DevartDtos/**/*'
          - 'WebApiAdmisiones/AppLogic.*/**/*Dto*.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Dto*.cs'

# Servicios de aplicación - solo código fuente, no tests
type:service:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/AppLogic.*/Services/**/*.cs'
          - 'WebApiAdmisiones/AppLogic.*/**/*Service.cs'
          - 'WebApiAdmisiones/AppLogic.*/**/*AppService.cs'

# Interfaces - solo código fuente, no tests
type:interface:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/AppLogic.*/IServices/**/*'
          - 'WebApiAdmisiones/BusinessLogic/IGenericRepository/**/*'

# Repositorios - solo código fuente, no tests
type:repository:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/DataAccess/GenericRepository/**/*'
          - 'WebApiAdmisiones/DataAccess/**/*Repository.cs'

# Controllers - solo código fuente, no tests
type:controller:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/WebApiFDP/Controllers/**/*'
          - 'WebApiAdmisiones/WebApiFDP/**/*Controller.cs'

# Helpers y Utilities - solo código fuente, no tests
type:helper:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/AppLogic.*/Helpers/**/*'
          - 'WebApiAdmisiones/AppLogic.*/Utilities/**/*'
          - 'WebApiAdmisiones/WebApiFDP/Helpers/**/*'
          - 'WebApiAdmisiones/WebApiFDP/Utilities/**/*'

# ═══════════════════════════════════════════════════════════════════
# ETIQUETAS DE DOCUMENTACIÓN Y CONFIGURACIÓN
# ═══════════════════════════════════════════════════════════════════

# Documentación (excluyendo Core)
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'WebApiAdmisiones/**/*.md'
          - 'docs/**/*'

# Configuración de CI/CD y GitHub
ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

# Archivos de proyecto/solución
build:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/**/*.csproj'
          - 'WebApiAdmisiones/**/*.sln'
          - 'WebApiAdmisiones/**/Directory.Build.props'
          - 'WebApiAdmisiones/**/nuget.config'

# Configuración de aplicación
config:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/**/appsettings*.json'
          - 'WebApiAdmisiones/**/*.config'

# ═══════════════════════════════════════════════════════════════════
# ETIQUETAS DE TESTS
# ═══════════════════════════════════════════════════════════════════

# Tests unitarios
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/UnitTesting/**/*'
          - 'WebApiAdmisiones/**/*Tests.cs'
          - 'WebApiAdmisiones/**/*Test.cs'
          - 'WebApiAdmisiones/**/*.runsettings'

# ═══════════════════════════════════════════════════════════════════
# ETIQUETAS DE SEGURIDAD Y INFRAESTRUCTURA
# ═══════════════════════════════════════════════════════════════════

# Seguridad (autenticación, autorización) - solo código fuente, no tests
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/WebApiAdmisiones/Security/**/*'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Authentication*.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Authorization*.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Token*.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Jwt*.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Sanitize*.cs'
          - 'WebApiAdmisiones/AppLogic.*/**/*Authentication*.cs'
          - 'WebApiAdmisiones/AppLogic.*/**/*Authorization*.cs'

# Docker y contenedores
docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/**/Dockerfile*'
          - 'docker-compose*.yml'
          - '.dockerignore'

# Middlewares - solo código fuente, no tests
type:middleware:
  - changed-files:
      - any-glob-to-any-file:
          - 'WebApiAdmisiones/WebApiAdmisiones/Middleware/**/*'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Middleware*.cs'
          - 'WebApiAdmisiones/WebApiAdmisiones/Filters/**/*'
          - 'WebApiAdmisiones/WebApiAdmisiones/**/*Filter*.cs'
