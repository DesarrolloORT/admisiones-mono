name: 'Setup Environment Files'
description: 'Generate frontend environment and web.config from the selected environment values'
inputs:
  env-filename:
    description: 'Environment filename: dev, staging, or prod'
    required: true
    default: dev
  CSP_POLICY:
    description: 'Content Security Policy'
    required: true
  RECAPTCHA_NONCE:
    description: 'CSP nonce used for the reCAPTCHA script tag (must match script-src in CSP_POLICY)'
    required: false
    default: ''
  CACHING_ENABLED:
    description: 'Enable frontend caching'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Generate generated environment and web.config
      shell: bash
      env:
        ENV_FILENAME: ${{ inputs.env-filename }}
        CSP_POLICY: ${{ inputs.CSP_POLICY }}
        RECAPTCHA_NONCE: ${{ inputs.RECAPTCHA_NONCE }}
        CACHING_ENABLED: ${{ inputs.CACHING_ENABLED }}
      run: |
        node --input-type=module <<'NODE'
        import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';

        const cspPolicy = process.env.CSP_POLICY?.trim();

        if (!cspPolicy) {
          throw new Error('CSP_POLICY is required to generate web.config.');
        }

        const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
        const environment = {
          production: process.env.ENV_FILENAME === 'prod',
          API_URL: process.env.API_URL ?? '',
          RECAPTCHA_KEY: process.env.RECAPTCHA_KEY ?? '',
          CSP_POLICY: cspPolicy,
          RECAPTCHA_NONCE: process.env.RECAPTCHA_NONCE ?? '',
          CACHING_ENABLED: process.env.CACHING_ENABLED !== 'false',
          APP_VERSION: `${packageJson.version}-${process.env.ENV_FILENAME}`,
          TELEMETRY_SERVICE_NAME: 'admisiones-frontend',
        };

        const escapeXmlAttribute = value =>
          value
            .replaceAll('&', '&amp;')
            .replaceAll('"', '&quot;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;');

        mkdirSync('src/environments', { recursive: true });
        writeFileSync(
          'src/environments/generated-environment.ts',
          [
            '// Generated by .github/actions/setup-env/action.yml. Do not edit manually.',
            `export const generatedEnvironment = ${JSON.stringify(environment, null, 2)} as const;`,
            '',
          ].join('\n'),
          'utf8'
        );

        writeFileSync(
          'src/web.config',
          `<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <system.webServer>
    <httpProtocol>
      <customHeaders>
        <add name="Cache-Control" value="no-cache" />
        <add name="X-Content-Type-Options" value="nosniff" />
        <add name="X-Frame-Options" value="SAMEORIGIN" />
        <add name="Content-Security-Policy" value="${escapeXmlAttribute(cspPolicy)}" />
        <add name="Referrer-Policy" value="no-referrer" />
        <add name="Permissions-Policy" value="camera=(), geolocation=(), microphone=()" />
        <add name="Strict-Transport-Security" value="max-age=31536000; includeSubDomains" />
      </customHeaders>
    </httpProtocol>
    <staticContent>
      <remove fileExtension=".json" />
      <mimeMap fileExtension=".json" mimeType="application/json" />
      <remove fileExtension=".webmanifest" />
      <mimeMap fileExtension=".webmanifest" mimeType="application/manifest+json" />
    </staticContent>
    <rewrite>
      <rules>
        <rule name="Angular Routes" stopProcessing="true">
          <match url=".*" />
          <conditions logicalGrouping="MatchAll">
            <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
            <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
          </conditions>
          <action type="Rewrite" url="/index.html" />
        </rule>
      </rules>
    </rewrite>
  </system.webServer>
</configuration>
`,
          'utf8'
        );
        NODE
