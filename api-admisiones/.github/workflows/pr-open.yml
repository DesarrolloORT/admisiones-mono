name: PR – Auto Document, Label & Summarize

on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  process-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false  # No necesitamos el submódulo para el labeler

    # 0. Ensure all labels exist with correct colors
    - name: Setup Labels with Colors
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        create_label() {
          gh label create "$1" --color "$2" --description "$3" --force 2>/dev/null || true
        }
        
        # NOTA: Etiquetas de Core se manejan en su propio repositorio
        
        # Capas de Arquitectura (Verdes)
        create_label "layer:api" "28a745" "Capa API/Controllers"
        create_label "layer:app-logic" "0e8a16" "Capa de Aplicación"
        create_label "layer:business-logic" "22863a" "Capa de Negocio"
        create_label "layer:data-access" "006b75" "Capa de Datos"
        
        # Tipos de Archivo (Amarillos/Naranjas)
        create_label "type:dto" "fbca04" "Data Transfer Objects"
        create_label "type:service" "f9a825" "Servicios"
        create_label "type:interface" "fef2c0" "Interfaces"
        create_label "type:repository" "d4c5f9" "Repositorios"
        create_label "type:controller" "ff9f1c" "Controllers"
        create_label "type:helper" "ffc107" "Helpers/Utilities"
        create_label "type:middleware" "e65100" "Middlewares/Filters"
        create_label "auto-generated" "e99695" "⚠️ NO modificar manualmente"
        
        # Documentación/Config (Grises/Azules)
        create_label "documentation" "0075ca" "Documentación"
        create_label "ci/cd" "333333" "CI/CD"
        create_label "build" "666666" "Build/Proyecto"
        create_label "config" "999999" "Configuración"
        
        # Tests y Seguridad
        create_label "tests" "00bcd4" "Pruebas"
        create_label "security" "b60205" "Seguridad"
        create_label "docker" "2496ed" "Docker"
        
        # Tamaño (Gradiente verde→rojo)
        create_label "size:XS" "3cbf00" "<100 líneas"
        create_label "size:S" "5d9801" "100-499 líneas"
        create_label "size:M" "7f7203" "500-1500 líneas"
        create_label "size:L" "a14c05" "1500-3000 líneas"
        create_label "size:XL" "c32607" "3000+ líneas"
        
        # Estado del PR (para pr-close.yml)
        create_label "merged" "6f42c1" "PR mergeado"
        create_label "closed" "cb2431" "PR cerrado sin merge"

    # 1. Apply labels based on file paths
    - name: Auto Label PR
      uses: actions/labeler@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        configuration-path: .github/labeler.yml
        sync-labels: true

    # 1.5. Apply size label based on lines changed
    - name: Label PR Size
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Get PR stats
        ADDITIONS=${{ github.event.pull_request.additions }}
        DELETIONS=${{ github.event.pull_request.deletions }}
        TOTAL=$((ADDITIONS + DELETIONS))
        
        # Remove existing size labels
        for size in "size:XS" "size:S" "size:M" "size:L" "size:XL"; do
          gh pr edit $PR_NUMBER --remove-label "$size" 2>/dev/null || true
        done
        
        # Determine size and apply label
        if [ $TOTAL -lt 100 ]; then
          LABEL="size:XS"
        elif [ $TOTAL -lt 500 ]; then
          LABEL="size:S"
        elif [ $TOTAL -lt 1500 ]; then
          LABEL="size:M"
        elif [ $TOTAL -lt 3000 ]; then
          LABEL="size:L"
        else
          LABEL="size:XL"
        fi
        
        gh pr edit $PR_NUMBER --add-label "$LABEL"
        echo "Applied label: $LABEL (Total lines changed: $TOTAL)"

    # 2. Generate summary of the PR using GitHub API
    - name: Generate PR Summary
      id: summary
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          const response = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number
          });
          
          const pr = response.data;
          const files = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number
          });
          
          const filesList = files.data.map(f => `- ${f.filename} (+${f.additions}/-${f.deletions})`).join('\n');
          
          const summary = `**Archivos modificados:** ${files.data.length}
          **Líneas:** +${pr.additions} / -${pr.deletions}
          
          ${filesList}`;
          
          return summary;

    # 3. Generate file changes documentation categorized by architecture
    - name: Generate Change Documentation
      id: doc
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          const files = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number
          });
          
          const categories = {
            'WebAPI (Controllers/Middlewares)': [],
            'Servicios (AppLogic)': [],
            'DTOs': [],
            'Entidades (BusinessLogic)': [],
            'Repositorios (DataAccess)': [],
            'Tests': [],
            'Configuración': [],
            'CI/CD': [],
            'Documentación': [],
            'Otros': []
          };
          
          files.data.forEach(f => {
            const name = f.filename;
            
            // Categorizar por estructura del proyecto
            if (name.startsWith('WebApiAdmisiones/WebApiAdmisiones/')) {
              categories['WebAPI (Controllers/Middlewares)'].push(name);
            } else if (name.startsWith('WebApiAdmisiones/AppLogic/')) {
              if (name.includes('Dto') || name.includes('DTO') || name.includes('/DTOs/')) {
                categories['DTOs'].push(name);
              } else {
                categories['Servicios (AppLogic)'].push(name);
              }
            } else if (name.startsWith('WebApiAdmisiones/BusinessLogic/')) {
              categories['Entidades (BusinessLogic)'].push(name);
            } else if (name.startsWith('WebApiAdmisiones/DataAccess/')) {
              categories['Repositorios (DataAccess)'].push(name);
            } else if (name.startsWith('WebApiAdmisiones/UnitTesting/') || name.includes('Test')) {
              categories['Tests'].push(name);
            } else if (name.startsWith('.github/')) {
              categories['CI/CD'].push(name);
            } else if (name.endsWith('.json') || name.endsWith('.config')) {
              categories['Configuración'].push(name);
            } else if (name.endsWith('.md')) {
              categories['Documentación'].push(name);
            } else {
              categories['Otros'].push(name);
            }
          });
          
          let doc = '#### Componentes Impactados\n';
          for (const [cat, items] of Object.entries(categories)) {
            if (items.length > 0) {
              doc += `\n**${cat}:**\n`;
              items.forEach(i => doc += `- \`${i}\`\n`);
            }
          }
          
          // Agregar advertencia si hay archivos auto-generados
          const autoGenerated = files.data.filter(f => 
            f.filename.includes('Devart') || f.filename.endsWith('.Generated.cs')
          );
          
          if (autoGenerated.length > 0) {
            doc += '\n⚠️ **Advertencia:** Este PR contiene archivos auto-generados por Devart. ';
            doc += 'Estos archivos NO deben modificarse manualmente.\n';
          }
          
          return doc;

    # 4. Comment on PR with the summary + documentation
    - name: Post PR summary & documentation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_SUMMARY: ${{ steps.summary.outputs.result }}
        PR_DOC: ${{ steps.doc.outputs.result }}
      run: |
        {
          echo "### 📊 PR Summary"
          echo ""
          echo "$PR_SUMMARY"
          echo ""
          echo "### 📝 Change Documentation"
          echo ""
          echo "$PR_DOC"
        } > comment.md
        
        gh pr comment "$PR_NUMBER" --body-file comment.md
