<dialog
  #dialog
  aria-modal="true"
  class="inscription-dialog"
  role="dialog"
  [attr.aria-describedby]="helperText() ? descriptionId : null"
  [attr.aria-labelledby]="titleId"
  (cancel)="requestClose($event)"
  (click)="onDialogClick($event)"
  (keydown)="onDialogKeydown($event)">
  <section class="inscription-dialog__sheet">
    <span aria-hidden="true" class="inscription-dialog__tracker"></span>

    <header class="inscription-dialog__header">
      <div>
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (helperText()) {
        <p [id]="descriptionId">{{ helperText() }}</p>
        }
      </div>
      <button
        ort-icon-button
        type="button"
        [attr.aria-label]="closeLabel()"
        (click)="requestClose()">
        <ort-icon aria-hidden="true">close</ort-icon>
      </button>
    </header>

    <div class="inscription-dialog__content">
      <ng-content />
    </div>

    <footer class="inscription-dialog__actions">
      <ng-content select="[inscriptionDialogActions]" />
    </footer>
  </section>
</dialog>
