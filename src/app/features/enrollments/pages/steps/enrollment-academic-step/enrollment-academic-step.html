<div
  aria-labelledby="enrollment-academic-title"
  class="enrollment-screen enrollment-screen--academic">
  <header class="enrollment-screen__header">
    <p class="enrollment-screen__eyebrow">Inscripción a carrera</p>
    <h1 id="enrollment-academic-title">Propuesta académica</h1>
    <p>Completar el proceso toma unos 10-15 minutos.</p>
    <span>Los campos marcados con un asterisco (*) son obligatorios.</span>
  </header>

  <form
    class="enrollment-form enrollment-form--academic"
    novalidate
    [formGroup]="facade.academicForm"
    (keydown.enter)="onFormEnter($event)"
    (ngSubmit)="facade.continue()">
    @if (facade.academicErrorAlert(); as error) {
    <app-error-alert [message]="error.message" [title]="error.title" />
    }
    <app-academic-proposal-select [form]="facade.academicForm" [selection]="facade.selection" />

    <footer class="enrollment-footer">
      <button ort-primary-button type="submit" [disabled]="facade.registeringProductInterest()">
        Continuar
      </button>
    </footer>
  </form>
</div>
