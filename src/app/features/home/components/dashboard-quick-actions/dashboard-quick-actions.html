@switch (action().type) {
  @case ('primary') {
    <button class="quick-actions__btn" ort-primary-button type="button" [attr.aria-label]="ariaLabel()">
      @if (action().icon) {
        <ort-icon aria-hidden="true">{{ action().icon }}</ort-icon>
      }
      {{ action().label }}
    </button>
  }
  @case ('secondary') {
    <button class="quick-actions__btn" ort-secondary-button type="button" [attr.aria-label]="ariaLabel()">
      {{ action().label }}
    </button>
  }
  @case ('text') {
    <p class="quick-actions__message" [attr.aria-label]="ariaLabel()">{{ action().label }}</p>
  }
}
