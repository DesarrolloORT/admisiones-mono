@switch (action().type) {
  @case ('primary') {
    <button class="quick-actions__btn" ort-primary-button type="button">
      {{ action().label }}
    </button>
  }
  @case ('secondary') {
    <button class="quick-actions__btn" ort-secondary-button type="button">
      {{ action().label }}
    </button>
  }
  @case ('text') {
    <p class="quick-actions__message">{{ action().label }}</p>
  }
}
