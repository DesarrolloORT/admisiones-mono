
<article class="dashboard-card" [attr.aria-labelledby]="'dashboard-card-title'">
  <ort-icon aria-hidden="true" class="dashboard-card__icon" size="lg">school</ort-icon>

  <div class="dashboard-card__chip">
    <app-dashboard-career-status-chip [status]="inscripcion().estado" />
  </div>

  <h3 class="dashboard-card__title" id="dashboard-card-title">{{ inscripcion().nombreProducto }}</h3>

  <div class="dashboard-card__meta">
    <ort-icon aria-hidden="true" class="dashboard-card__meta-icon" size="md">calendar_today</ort-icon>
    <p class="dashboard-card__meta-text">
      <span class="dashboard-card__meta-label">Comienzo</span>
      <span class="dashboard-card__meta-value">{{ inscripcion().nombreComienzo }}</span>
    </p>
  </div>

  <div class="dashboard-card__actions">
    <app-dashboard-quick-actions [status]="inscripcion().estado" />
  </div>
</article>
