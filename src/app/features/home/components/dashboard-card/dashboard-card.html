<article class="dashboard-card" [attr.aria-labelledby]="titleId">
  <ort-icon aria-hidden="true" class="dashboard-card__icon" size="lg">{{ icon() }}</ort-icon>

  @if (showChip()) {
  <div class="dashboard-card__chip">
    <app-dashboard-career-status-chip [status]="estado()" />
  </div>
  }

  <h3 class="dashboard-card__title" [id]="titleId">{{ title() }}</h3>

  <div class="dashboard-card__meta">
    @if (variant() === 'careers') { @if (!esPaquete()) {
    <app-dashboard-card-summary
      variant="careers"
      [startDate]="inscripcion()?.nombreComienzo ?? ''" />
    } } @else {
    <app-dashboard-card-summary
      variant="scholarships"
      [applicationDeadline]="beca()?.cierrePostulacion ?? ''"
      [benefit]="beca()?.beneficio ?? ''"
      [careerName]="beca()?.nombreCarrera ?? ''"
      [examDate]="beca()?.fechaPrueba ?? ''"
      [examResult]="beca()?.resultadoPrueba ?? ''"
      [resultsDate]="beca()?.fechaResultados ?? ''"
      [status]="estado()" />
    } @if (paymentDeadline()) {
    <p class="dashboard-card__deadline">Fecha límite: {{ paymentDeadline() }}</p>
    }
  </div>

  @if (showActions()) {
  <div class="dashboard-card__actions">
    <app-dashboard-quick-actions
      [cardType]="variant()"
      [careerName]="title()"
      [idInscripciones]="idsInscripcion()"
      [idInscripto]="inscripcion()?.idInscripto ?? null"
      [idOfertas]="inscripcion()?.idOfertas ?? []"
      [idProceso]="inscripcion()?.idProceso ?? null"
      [idProducto]="inscripcion()?.idProducto ?? null"
      [status]="estado()" />
  </div>
  }
</article>
