@if (hasPendingPayment()) {
<ort-alert
  actionAriaLabel="Ir al pago pendiente"
  purpose="warning"
  radius="straight"
  [actionIcon]="pendingPaymentSummary().navigable ? 'arrow_forward' : undefined"
  [hideStatusIcon]="hideStatusIcon()"
  (actionTriggered)="navigateToPendingPayment()">
  <ort-alert-title>
    {{ pendingPaymentSummary().title }}
    <span class="alert-detail--inline">{{ pendingPaymentSummary().detail }}</span>
  </ort-alert-title>
  <ort-alert-supporting-text class="alert-detail--block">
    {{ pendingPaymentSummary().detail }}
  </ort-alert-supporting-text>
</ort-alert>
}

<main class="dashboard-main" id="main-content" tabindex="-1">
  <header class="dashboard-greeting">
    <h1>{{ greeting() }}</h1>
    <p>Aquí podés gestionar tu inscripción y postulación a becas.</p>
  </header>

  <section class="dashboard-container">
    <section class="dashboard-actions">
      <app-dashboard-action-card variant="enrollment" />
      <app-dashboard-action-card variant="scholarship" />
    </section>
    <div class="dashboard-cards" [class.dashboard-cards--row]="singleRow()">
      <app-dashboard-enrollments-section
        class="dashboard-enrollments"
        [enrollments]="enrollments()"
        [singleRow]="singleRow()" />
      <app-dashboard-scholarships-section
        class="dashboard-scholarships"
        [scholarships]="scholarships()"
        [singleRow]="singleRow()" />
    </div>
  </section>
</main>
