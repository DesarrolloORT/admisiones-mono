<section aria-labelledby="scholarship-academic-title" class="scholarship-screen">
  <header class="scholarship-screen__header">
    <h1 id="scholarship-academic-title">Postulación a beca</h1>
    <p>Este proceso te llevará aproximadamente 10–15 minutos.</p>
    <span>Los campos marcados con un asterisco (*) son obligatorios.</span>
  </header>

  <form novalidate [formGroup]="facade.academicForm" (ngSubmit)="facade.continue()">
    <app-academic-proposal-select [form]="facade.academicForm" [selection]="facade.selection" />

    <footer class="scholarship-footer">
      <button ort-primary-button type="submit">Continuar</button>
    </footer>
  </form>
</section>
