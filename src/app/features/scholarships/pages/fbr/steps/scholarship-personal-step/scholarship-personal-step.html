<section aria-labelledby="scholarship-postulation-title" class="scholarship-screen">
  <header class="scholarship-screen__header">
    <h1 id="scholarship-postulation-title">Información personal</h1>
    <p>
      Ingresá tus datos personales y educativos. Según la modalidad, deberás completar información
      adicional.
    </p>
    <span>Los campos marcados con un asterisco (*) son obligatorios.</span>
  </header>

  <form>
    <ort-accordion>
      <ort-accordion-item [expanded]="true">
        <ort-accordion-header>
          <ort-accordion-title>
            <ort-icon name="person" ortAccordionTitleLeadingIcon size="md" />
            Datos personales
          </ort-accordion-title>
        </ort-accordion-header>
        <ort-accordion-body>
          <app-personal-data />
        </ort-accordion-body>
      </ort-accordion-item>

      <ort-accordion-item>
        <ort-accordion-header>
          <ort-accordion-title>
            <ort-icon name="auto_stories" ortAccordionTitleLeadingIcon size="md" />
            Información educativa
          </ort-accordion-title>
        </ort-accordion-header>

        <ort-accordion-body>
          <app-education-info-fbr />
        </ort-accordion-body>
      </ort-accordion-item>

      <ort-accordion-item>
        <ort-accordion-header>
          <ort-accordion-title>
            <ort-icon name="description" ortAccordionTitleLeadingIcon size="md" />
            Declaración jurada
          </ort-accordion-title>
        </ort-accordion-header>
        <ort-accordion-body>
          <app-declaration />
        </ort-accordion-body>
      </ort-accordion-item>
    </ort-accordion>
  </form>
  <button ort-primary-button type="button">Continuar</button>
</section>
