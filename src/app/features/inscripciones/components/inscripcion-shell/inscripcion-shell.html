<div class="inscription-shell">
  <div class="inscription-shell__top">
    <header class="inscription-header">
      <div class="inscription-header__content">
        <div class="inscription-header__action">
          @if (showBack()) {
          <button
            aria-label="Volver al paso anterior"
            class="inscription-header__icon-button"
            type="button"
            (click)="backClick()">
            <ort-icon aria-hidden="true">arrow_back_ios</ort-icon>
          </button>
          }
        </div>

        <div class="inscription-brand">
          <img
            alt="ORT"
            class="inscription-brand__logo"
            height="36"
            ngSrc="/assets/auth/ort-logo-white.svg"
            width="53" />
          <span aria-hidden="true" class="inscription-brand__divider"></span>
          <span class="inscription-brand__name">Admisiones</span>
        </div>

        <div class="inscription-header__action">
          <button
            aria-label="Cerrar inscripción"
            class="inscription-header__icon-button"
            type="button"
            (click)="closeFlow.emit()">
            <ort-icon aria-hidden="true">close</ort-icon>
          </button>
        </div>
      </div>
    </header>

    @if (showStepper()) {
    <section aria-label="Progreso de inscripción" class="inscription-progress">
      <p class="inscription-progress__title">Inscripción a carrera</p>
      <ort-stepper
        [animationEnabled]="false"
        [linear]="true"
        [selectedIndex]="stepNumber() - 1">
        @for (step of steps(); track step.id) {
        <ort-step
          [attr.id]="'ort-step-panel-' + step.id"
          [completed]="step.status === 'completo'"
          [disabled]="step.status === 'pendiente'"
          [editable]="false"
          [id]="step.id"
          [label]="step.title">
          <span ortStepSupportingText>{{ step.overline }}</span>
        </ort-step>
        }
      </ort-stepper>
      <p aria-live="polite" class="sr-only">{{ stepLabel() }}</p>
    </section>
    }
  </div>

  <main class="inscription-shell__main" id="main-content" tabindex="-1">
    <ng-content />
  </main>
</div>
