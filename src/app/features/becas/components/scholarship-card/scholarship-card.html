<article
  class="scholarship-card"
  [attr.aria-labelledby]="'scholarship-card-title'"
  [class.scholarship-card--single]="single()">
  <div class="scholarship-card__header">
    <span class="scholarship-card__title-span">Fondo</span>
    <h2 class="scholarship-card__title" id="scholarship-card-title">{{ beca().title }}</h2>
  </div>

  <p class="scholarship-card__description">{{ beca().description }}</p>

  @if (beca().test) {
  <ort-chip label="Requiere rendir prueba" type="status" variant="primary" />
  } @if (inscripto()) {
  <a
    class="scholarship-card__btn"
    ort-primary-button
    [attr.aria-label]="'Postularme a Fondo ' + beca().title"
    [routerLink]="beca().route">
    Postularme
  </a>
  } @else {
  <ort-chip label="Requiere inscripción previa" type="status" variant="primary" />
  <a
    class="scholarship-card__btn"
    ort-secondary-button
    routerLink="/inscripciones"
    [attr.aria-label]="'Ir a inscripciones'">
    Ir a inscripciones
  </a>
  }
</article>
