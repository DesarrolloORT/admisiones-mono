@if (!onboardingCompleted()) {
<app-home-header [showBack]="true" />
<main class="scholarship-process__main">
  <app-scholarship-onboarding variant="fbr" (continueRequested)="startApplication()" />
</main>
} @else if (!show()) {
<app-process-layout
  closeLabel="Cerrar becas"
  processTitle="Postulación a becas"
  stepperAriaLabel="Progreso de postulación a becas"
  [currentStepId]="process.currentStep()"
  [showBack]="process.canGoBack()"
  [showStepper]="true"
  [stepperSubtitle]="process.stepLabel()"
  [steps]="process.stepItems()"
  (back)="process.back()"
  (closeFlow)="goHome()"
  (logoutRequested)="logout()">
  <main class="scholarship-process__main">
    @switch (process.currentStep()) { @case ('info-postulacion') {
    <app-scholarship-confirmation-step variant="fbr" (confirmApplication)="showSuccess()" />
    <!-- <app-scholarship-academic-step variant="fbr" /> -->
    } @case ('info-personal') {
    <app-scholarship-personal-step variant="fbr" />
    } @case ('confirmacion') {
    <!-- Punto de extensión: montar acá el step de confirmación (ver README). -->
    } }
  </main>
</app-process-layout>
} @else {
<app-scholarship-success variant="fbc" />
}
