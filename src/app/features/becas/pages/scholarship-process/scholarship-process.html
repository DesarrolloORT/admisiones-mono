@if (!onboardingCompleted()) {
<app-home-header [showBack]="showBack()" />
<app-scholarship-onboarding-step [variant]="variant" (continueRequested)="startApplication()" />

} @else if (!success()) {
<app-process-layout
  closeLabel="Cerrar becas"
  processTitle="Postulación a becas"
  stepperAriaLabel="Progreso de postulación a becas"
  [currentStepId]="process.currentStep()"
  [showBack]="showBack() && process.canGoBack()"
  [showStepper]="true"
  [stepperSubtitle]="process.stepLabel()"
  [steps]="process.stepItems()"
  (back)="process.back()"
  (closeFlow)="goHome()"
  (logoutRequested)="logout()">
  <main class="scholarship-process__main">
    @switch (process.currentStep()) { @case ('info-postulacion') {
    <app-scholarship-academic-step [variant]="variant" />
    } @case ('info-personal') {
    <app-scholarship-personal-step [variant]="variant" />
    } @case ('confirmacion') {
    <app-scholarship-confirmation-step [variant]="variant" (confirmApplication)="showSuccess()" />
    } }
  </main>
</app-process-layout>
} @else {
<app-scholarship-success-step [variant]="variant" />
}
