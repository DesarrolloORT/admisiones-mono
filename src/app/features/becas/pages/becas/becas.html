<app-home-header [showBack]="showBack()" />
<main class="becas-main">
  <section aria-labelledby="scholarships-title" class="scholarships-screen">
    <div class="scholarships-screen__header">
      <h1 class="scholarships-title" id="scholarships-title">Postulación a becas</h1>
      @if (inscripto()) {
      <p class="scholarships-description">Conocé las becas disponibles y sus requisitos.</p>
      }@else {
      <p class="scholarships-description">
        Conocé las becas disponibles y sus requisitos. Para postularte a una beca, necesitás haber
        completado el proceso de inscripción.
      </p>
      }
    </div>
    <ul class="scholarship-list">
      @for (beca of becas(); track $index) {
      <li>
        <app-scholarship-card [beca]="beca" [inscripto]="inscripto()" />
      </li>
      }
    </ul>
  </section>
</main>
