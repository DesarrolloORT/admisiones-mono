<form class="auth-form-body" novalidate [formGroup]="form()" (ngSubmit)="onSubmit()">
  @if (personalMode() === 'verification') {
  <app-register-personal-verification-fields [form]="form()" />
  } @else {
  <app-register-personal-complete-fields [form]="form()" />
  }

  <p class="auth-error" role="alert" [hidden]="!hasSubmittedInvalidFields()">
    Completá todos los datos obligatorios para continuar.
  </p>

  @if (error()) {
  <p class="auth-error" role="alert">{{ error() }}</p>
  } @if (successMessage()) {
  <output class="auth-success">{{ successMessage() }}</output>
  }

  <div class="auth-actions">
    <button ort-secondary-button type="button" (click)="back.emit()">Volver</button>
    <button ort-primary-button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Enviando...' : 'Continuar' }}
    </button>
  </div>
</form>
