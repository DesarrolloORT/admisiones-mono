<form class="auth-form-body" novalidate [formGroup]="form()" (ngSubmit)="onSubmit()">
  @if (personalMode() === 'verification') {
  <app-register-personal-verification-fields [form]="form()" />
  } @else {
  <app-register-personal-complete-fields [form]="form()" [submitted]="submitted()" />
  }

  <div #errorSummaryAnchor tabindex="-1">
    <ort-error-summary [errors]="errorSummary()" />
  </div>

  <div class="auth-actions">
    <button ort-secondary-button type="button" (click)="back.emit()">Volver</button>
    <button
      ort-primary-button
      type="submit"
      [disabled]="isSubmitting() || isCompleted()"
      [loading]="isSubmitting()"
      [loadingLabel]="submittingLabel()">
      {{ isCompleted() ? 'Enviado' : isSubmitting() ? submittingLabel() : submitLabel() }}
    </button>
  </div>
</form>
