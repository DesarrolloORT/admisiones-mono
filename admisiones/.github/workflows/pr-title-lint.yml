name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: main

jobs:
  title-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          # Enforce format: release/v{major}.{minor}.{patch}
          if ! [[ "$TITLE" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: PR title must follow the format release/v*.*.* (e.g., release/v1.2.3)."
            exit 1
          fi
